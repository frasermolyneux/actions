name: reusable-code-quality

on:
  workflow_call:
    outputs:
      quality-evidence-artifact-id:
        description: Structured test artifact ID when .NET test-reporting is enabled.
        value: ${{ jobs.test-results.outputs.evidence-artifact-id }}
    inputs:
      sonar-project-key:
        description: SonarCloud project key (e.g., frasermolyneux_portal-server-events).
        required: true
        type: string
      sonar-organization:
        description: SonarCloud organization key.
        required: false
        default: frasermolyneux
        type: string
      sonar-host-url:
        description: SonarCloud host URL.
        required: false
        default: https://sonarcloud.io
        type: string
      build-target:
        description: Selects the composite build action to run (dotnet-ci, dotnet-web-ci, dotnet-func-ci, or cmake-ci).
        required: false
        default: dotnet-ci
        type: string
      dotnet-project:
        description: Required when build-target is dotnet-func-ci or dotnet-web-ci; the project name.
        required: false
        type: string
      publish-frameworks:
        description: Optional list of target frameworks to publish (only for dotnet-web-ci).
        required: false
        default: ""
        type: string
      nuget-artifact-name:
        description: Artifact name for NuGet packages (dotnet-web-ci only).
        required: false
        default: nuget-packages
        type: string
      dotnet-version:
        description: .NET SDK version(s) to install.
        required: false
        default: 9.0.x
        type: string
      skip-format-check:
        description: Skip dotnet format verification in .NET build actions.
        required: false
        default: false
        type: boolean
      test-reporting:
        description: Opt in to isolated .NET TRX artifacts, validated summaries and failure annotations.
        required: false
        default: false
        type: boolean
      src-folder:
        description: Folder that contains the .NET solution/projects.
        required: false
        default: src
        type: string
      use-framework-output-root:
        description: For dotnet-func-ci, upload the first target framework folder instead of bin/Release.
        required: false
        default: false
        type: boolean
      codeql-languages:
        description: CodeQL languages to initialize (for example csharp or cpp).
        required: false
        default: csharp
        type: string
      codeql-category:
        description: Category used by CodeQL analyze.
        required: false
        default: /language:csharp
        type: string
      cmake-source-dir:
        description: Source directory for CMake builds.
        required: false
        default: .
        type: string
      cmake-build-dir:
        description: Build directory for CMake builds.
        required: false
        default: build
        type: string
      cmake-configure-args:
        description: Additional arguments passed to cmake configure.
        required: false
        default: -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        type: string
      cmake-build-args:
        description: Additional arguments passed to cmake --build.
        required: false
        default: --config Release
        type: string
      ctest-args:
        description: Additional arguments passed to ctest.
        required: false
        default: --output-on-failure --build-config Release
        type: string
      skip-sonar:
        description: Skip SonarCloud analysis (only run CodeQL).
        required: false
        default: false
        type: boolean
      skip-codeql:
        description: Skip CodeQL analysis (only run SonarCloud).
        required: false
        default: false
        type: boolean
    secrets:
      SONAR_TOKEN:
        description: SonarCloud token with analysis rights.
        required: false

permissions: {}

jobs:
  code-quality:
    permissions:
      contents: read
      actions: read
      security-events: write
    name: Code Quality
    runs-on: ubuntu-latest
    outputs:
      test_report: ${{ steps.build-dotnet.outputs.test-report || steps.build-web.outputs.test-report || steps.build-function.outputs.test-report }}
    env:
      SONAR_CACHE_DIR: ~/.sonar/cache
      SONAR_SCANNER_DIR: $RUNNER_TEMP/sonar-scanner

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up .NET for SonarCloud
        if: ${{ inputs.skip-sonar != true && inputs.build-target != 'cmake-ci' }}
        uses: frasermolyneux/actions/dotnet-sdk-setup@dotnet-sdk-setup/v1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Set up JDK 17
        if: ${{ inputs.skip-sonar != true }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          java-version: 17
          distribution: zulu

      - name: Cache SonarCloud packages
        if: ${{ inputs.skip-sonar != true && inputs.build-target != 'cmake-ci' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.SONAR_CACHE_DIR }}
          key: ${{ runner.os }}-sonar-cache

      - name: Cache SonarCloud scanner
        if: ${{ inputs.skip-sonar != true && inputs.build-target != 'cmake-ci' }}
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.SONAR_SCANNER_DIR }}
          key: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: ${{ inputs.skip-sonar != true && inputs.build-target != 'cmake-ci' && steps.cache-sonar-scanner.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          mkdir -p "${{ env.SONAR_SCANNER_DIR }}"
          dotnet tool update dotnet-sonarscanner --tool-path "${{ env.SONAR_SCANNER_DIR }}"

      - name: Validate build target
        shell: bash
        run: |
          case "${{ inputs.build-target }}" in
            dotnet-ci|dotnet-web-ci|dotnet-func-ci|cmake-ci) ;;
            *)
              echo "Unsupported build-target: ${{ inputs.build-target }}" >&2
              exit 1
              ;;
          esac

      - name: Initialize CodeQL
        if: ${{ inputs.skip-codeql != true }}
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ inputs.codeql-languages }}

      - name: Validate project inputs
        if: inputs.build-target == 'dotnet-func-ci' || inputs.build-target == 'dotnet-web-ci'
        shell: bash
        run: |
          if [ -z "${{ inputs.dotnet-project }}" ]; then
            echo "dotnet-project is required when build-target is dotnet-func-ci or dotnet-web-ci" >&2
            exit 1
          fi

      - name: Prepare managed SonarCloud policy
        id: sonar-policy
        if: ${{ inputs.skip-sonar != true }}
        shell: bash
        env:
          SONAR_POLICY_PATH: ${{ github.workspace }}/.sonarcloud.json
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile, stat } from "node:fs/promises";

          const exactKeys = (value, keys, message) => {
            if (!value || typeof value !== "object" || Array.isArray(value) ||
                Object.keys(value).sort().join("\0") !== [...keys].sort().join("\0")) {
              throw new Error(message);
            }
          };
          const reason = (value) => typeof value === "string" && value === value.trim() &&
            [...new Intl.Segmenter("und", { granularity: "grapheme" }).segment(value)].length >= 10 &&
            [...new Intl.Segmenter("und", { granularity: "grapheme" }).segment(value)].length <= 240 &&
            !/[\u0000-\u001f\u007f-\u009f\u2028\u2029\ud800-\udfff\ufffe\uffff]/u.test(value);
          const rulePattern = /^[A-Za-z][A-Za-z0-9_.-]*:[A-Za-z0-9_.-]+$/;
          const globPattern = /^(?!\/)(?!.*(?:^|\/)\.{1,2}(?:\/|$))(?!.*[,\\\s])[A-Za-z0-9._/*?-]+$/;
          const actionableRules = [
            "csharpsquid:S2699", "csharpsquid:S3237", "csharpsquid:S3427",
            "javascript:S2004", "javascript:S2699", "javascript:S3358", "javascript:S3776",
            "javascript:S5843", "javascript:S6353", "javascript:S6535", "javascript:S6582",
            "javascript:S7758", "javascript:S7767", "javascript:S7770", "javascript:S7772",
            "javascript:S7773", "javascript:S7776", "javascript:S7780", "javascript:S7781",
            "javascript:S7785", "javascript:S7786", "javascript:S9382",
            "python:S1192", "python:S3776", "python:S5778", "shell:S7677",
            "Web:InputWithoutLabelCheck", "Web:S5254", "Web:S5256", "Web:S6840",
            "Web:S6843", "Web:S6845", "Web:S6850", "Web:S6853",
          ];
          const commonExclusions = [
            "**/node_modules/**", "**/vendor/**", "**/wwwroot/lib/**", "**/*.min.js", "**/*.min.css",
          ];
          let policy = {
            version: "sonar-policy-v1",
            provenance: "repository-standards-v1",
            profiles: [],
            ignoredRules: [],
            exclusions: [],
          };
          try {
            const metadata = await stat(process.env.SONAR_POLICY_PATH);
            if (!metadata.isFile() || metadata.size > 256 * 1024) {
              throw new Error("Managed Sonar policy exceeds the file bound");
            }
            policy = JSON.parse(await readFile(process.env.SONAR_POLICY_PATH, "utf8"));
          } catch (error) {
            if (error.code !== "ENOENT") throw error;
          }
          exactKeys(policy, ["version", "provenance", "profiles", "ignoredRules", "exclusions"],
            "Invalid managed Sonar policy");
          if (policy.version !== "sonar-policy-v1" ||
              policy.provenance !== "repository-standards-v1" ||
              !Array.isArray(policy.profiles) || policy.profiles.length > 2 ||
              !policy.profiles.every((name) => ["actionable-only", "common-vendor-assets"].includes(name)) ||
              new Set(policy.profiles).size !== policy.profiles.length ||
              !Array.isArray(policy.ignoredRules) || policy.ignoredRules.length > 128 ||
              !Array.isArray(policy.exclusions) || policy.exclusions.length > 64) {
            throw new Error("Invalid managed Sonar policy");
          }
          const rules = new Set();
          for (const rule of policy.ignoredRules) {
            exactKeys(rule, ["key", "reason"], "Invalid managed Sonar ignored rule");
            if (!rulePattern.test(rule.key) || rules.has(rule.key) || !reason(rule.reason)) {
              throw new Error("Invalid managed Sonar ignored rule");
            }
            rules.add(rule.key);
          }
          const expectedRules = policy.profiles.includes("actionable-only") ? actionableRules : [];
          if (JSON.stringify([...rules]) !== JSON.stringify(expectedRules)) {
            throw new Error("Managed Sonar ignored rules do not match the approved profile");
          }
          const patterns = new Set();
          for (const exclusion of policy.exclusions) {
            exactKeys(exclusion, ["pattern", "reason"], "Invalid managed Sonar exclusion");
            if (exclusion.pattern.length > 240 || !globPattern.test(exclusion.pattern) ||
                patterns.has(exclusion.pattern) || !reason(exclusion.reason)) {
              throw new Error("Invalid managed Sonar exclusion");
            }
            patterns.add(exclusion.pattern);
          }
          const exclusions = [...patterns];
          const commonCount = policy.profiles.includes("common-vendor-assets") ? commonExclusions.length : 0;
          const expectedCommon = policy.profiles.includes("common-vendor-assets") ? commonExclusions : [];
          if (JSON.stringify(exclusions.slice(0, commonCount)) !== JSON.stringify(expectedCommon)) {
            throw new Error("Managed Sonar exclusions do not match the approved common profile");
          }
          for (const pattern of exclusions.slice(commonCount)) {
            const parts = pattern.split("/");
            if (pattern.startsWith("**/") || parts.length < 3 ||
                (parts.at(-1) === "**" && !["less", "scss", "vendor", "lib"].includes(parts.at(-2)))) {
              throw new Error("Managed Sonar targeted exclusion is too broad");
            }
          }
          const properties = [];
          if (policy.exclusions.length) {
            properties.push(["sonar.exclusions", policy.exclusions.map(({ pattern }) => pattern).join(",")]);
          }
          if (policy.ignoredRules.length) {
            const criteria = policy.ignoredRules.map((_, index) => `managed${index + 1}`);
            properties.push(["sonar.issue.ignore.multicriteria", criteria.join(",")]);
            for (const [index, rule] of policy.ignoredRules.entries()) {
              const criterion = criteria[index];
              properties.push([`sonar.issue.ignore.multicriteria.${criterion}.ruleKey`, rule.key]);
              properties.push([`sonar.issue.ignore.multicriteria.${criterion}.resourceKey`, "**/*"]);
            }
          }
          const dotnet = properties.map(([key, value]) => `/d:${key}=${value}`);
          const cli = properties.map(([key, value]) => `-D${key}=${value}`);
          await appendFile(process.env.GITHUB_OUTPUT,
            `dotnet-arguments=${JSON.stringify(dotnet)}\ncli-arguments=${cli.join(" ")}\n`);
          NODE

      - name: Begin SonarCloud analysis
        if: ${{ inputs.skip-sonar != true && inputs.build-target != 'cmake-ci' }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_POLICY_ARGUMENTS: ${{ steps.sonar-policy.outputs.dotnet-arguments }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
          SONAR_ORGANIZATION: ${{ inputs.sonar-organization }}
          SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
          SONAR_SOURCE_DIRECTORY: ${{ inputs.src-folder }}
          SONAR_SCANNER: ${{ env.SONAR_SCANNER_DIR }}/dotnet-sonarscanner
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { realpathSync } from "node:fs";
          import path from "node:path";

          if (!/^[A-Za-z0-9_.:-]+$/.test(process.env.SONAR_PROJECT_KEY) ||
              !/^[A-Za-z0-9_.-]+$/.test(process.env.SONAR_ORGANIZATION) ||
              !/^https:\/\/[A-Za-z0-9.-]+(?::[0-9]+)?(?:\/.*)?$/.test(process.env.SONAR_HOST_URL)) {
            throw new Error("Invalid Sonar project configuration");
          }
          const root = realpathSync(process.env.GITHUB_WORKSPACE);
          const source = realpathSync(path.join(root, process.env.SONAR_SOURCE_DIRECTORY));
          if (source !== root && !source.startsWith(root + path.sep)) {
            throw new Error("Sonar source directory escapes the checked-out repository");
          }
          const policyArguments = JSON.parse(process.env.SONAR_POLICY_ARGUMENTS);
          if (!Array.isArray(policyArguments) ||
              !policyArguments.every((argument) => typeof argument === "string" && argument.startsWith("/d:sonar."))) {
            throw new Error("Invalid prepared Sonar policy arguments");
          }
          const result = spawnSync(process.env.SONAR_SCANNER, [
            "begin",
            `/k:${process.env.SONAR_PROJECT_KEY}`,
            `/o:${process.env.SONAR_ORGANIZATION}`,
            `/d:sonar.token=${process.env.SONAR_TOKEN}`,
            `/d:sonar.host.url=${process.env.SONAR_HOST_URL}`,
            ...policyArguments,
          ], { cwd: source, env: process.env, stdio: "inherit" });
          if (result.status !== 0) process.exit(result.status ?? 1);
          NODE

      - name: Build and test (.NET)
        id: build-dotnet
        if: inputs.build-target == 'dotnet-ci'
        uses: frasermolyneux/actions/dotnet-ci@dotnet-ci/v2
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          skip-format-check: ${{ inputs.skip-format-check }}
          test-reporting: ${{ inputs.test-reporting }}
          src-folder: ${{ inputs.src-folder }}
          perform-checkout: 'false'

      - name: Build and publish (Web)
        id: build-web
        if: inputs.build-target == 'dotnet-web-ci'
        uses: frasermolyneux/actions/dotnet-web-ci@dotnet-web-ci/v2
        with:
          dotnet-project: ${{ inputs.dotnet-project }}
          dotnet-version: ${{ inputs.dotnet-version }}
          publish-frameworks: ${{ inputs.publish-frameworks }}
          skip-format-check: ${{ inputs.skip-format-check }}
          test-reporting: ${{ inputs.test-reporting }}
          src-folder: ${{ inputs.src-folder }}
          nugetArtifactName: ${{ inputs.nuget-artifact-name }}
          perform-checkout: 'false'

      - name: Build and test (Function)
        id: build-function
        if: inputs.build-target == 'dotnet-func-ci'
        uses: frasermolyneux/actions/dotnet-func-ci@dotnet-func-ci/v2
        with:
          dotnet-project: ${{ inputs.dotnet-project }}
          dotnet-version: ${{ inputs.dotnet-version }}
          skip-format-check: ${{ inputs.skip-format-check }}
          test-reporting: ${{ inputs.test-reporting }}
          src-folder: ${{ inputs.src-folder }}
          perform-checkout: 'false'
          use-framework-output-root: ${{ inputs.use-framework-output-root }}

      - name: Configure CMake
        if: inputs.build-target == 'cmake-ci'
        shell: bash
        run: |
          cmake -S "${{ inputs.cmake-source-dir }}" -B "${{ inputs.cmake-build-dir }}" ${{ inputs.cmake-configure-args }}

      - name: Build (CMake)
        if: inputs.build-target == 'cmake-ci'
        shell: bash
        run: |
          cmake --build "${{ inputs.cmake-build-dir }}" ${{ inputs.cmake-build-args }}

      - name: Test (CMake)
        if: inputs.build-target == 'cmake-ci'
        shell: bash
        run: |
          ctest --test-dir "${{ inputs.cmake-build-dir }}" ${{ inputs.ctest-args }}

      - name: Run SonarCloud analysis (C/C++)
        if: ${{ inputs.skip-sonar != true && inputs.build-target == 'cmake-ci' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ inputs.sonar-project-key }}
            -Dsonar.organization=${{ inputs.sonar-organization }}
            -Dsonar.host.url=${{ inputs.sonar-host-url }}
            ${{ steps.sonar-policy.outputs.cli-arguments }}

      - name: End SonarCloud analysis
        if: ${{ inputs.skip-sonar != true && inputs.build-target != 'cmake-ci' && always() }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SOURCE_DIRECTORY: ${{ inputs.src-folder }}
          SONAR_SCANNER: ${{ env.SONAR_SCANNER_DIR }}/dotnet-sonarscanner
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { realpathSync } from "node:fs";
          import path from "node:path";

          const root = realpathSync(process.env.GITHUB_WORKSPACE);
          const source = realpathSync(path.join(root, process.env.SONAR_SOURCE_DIRECTORY));
          if (source !== root && !source.startsWith(root + path.sep)) {
            throw new Error("Sonar source directory escapes the checked-out repository");
          }
          const result = spawnSync(process.env.SONAR_SCANNER,
            ["end", `/d:sonar.token=${process.env.SONAR_TOKEN}`],
            { cwd: source, env: process.env, stdio: "inherit" });
          if (result.status !== 0) process.exit(result.status ?? 1);
          NODE

      - name: Perform CodeQL analysis
        if: ${{ inputs.skip-codeql != true }}
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: ${{ inputs.codeql-category }}

  test-results:
    name: Retain structured test evidence
    if: always() && inputs.test-reporting && inputs.build-target != 'cmake-ci'
    needs: [code-quality]
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      evidence-artifact-id: ${{ steps.summary.outputs.evidence-artifact-id }}
    steps:
      - name: Publish bounded test evidence without PR write permissions
        id: summary
        uses: frasermolyneux/actions/test-results-summary@28f6613d746ec836d245f10259ea124897d8254a # test-results-summary/v1.1.0
        with:
          jobs: ${{ toJSON(needs) }}
          publish-comment: "false"
