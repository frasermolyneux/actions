name: "terraform-plan-and-apply"
description: "Runs terraform plan and apply in a single job with Azure OIDC authentication, optionally posting plan results to the PR"

inputs:
  terraform-version:
    description: "Optional exact assertion matching the committed root .terraform-version"
    default: ""
  terraform-environment:
    description: "Environment name override for execution evidence"
    default: ""
  terraform-folder:
    description: "The folder containing the Terraform projects"
    required: true
    default: "terraform"
  terraform-var-file:
    description: "The var-file to to be used for the Terraform plan (tfvars/dev.tfvars, tfvars/test.tfvars, tfvars/prod.tfvars, etc.)"
    required: true
    default: "tfvars/dev.tfvars"
  terraform-backend-file:
    description: "The backend-file to to be used for the Terraform plan (backends/dev.backend.hcl, backends/test.backend.hcl, backends/prod.backend.hcl, etc.)"
    required: false
  terraform-additional-args:
    description: "POSIX-style quoted argument list; no shell expansion; requires Python 3 on PATH"
    required: false
    default: ""
  backend-subscription-id:
    description: "The backend subscription_id if the terraform-backend-file is not being used"
    required: false
  backend-resource-group-name:
    description: "The backend resource_group_name if the terraform-backend-file is not being used"
    required: false
  backend-storage-account-name:
    description: "The backend storage_account_name if the terraform-backend-file is not being used"
    required: false
  backend-container-name:
    description: "The backend container_name if the terraform-backend-file is not being used"
    required: false
    default: ""
  backend-key:
    description: "The backend key if the terraform-backend-file is not being used"
    required: false
    default: ""
  backend-tags:
    description: "The backend tags to be applied to the storage account"
    required: false
    default: ""
  AZURE_CLIENT_ID: 
    description: "The azure client/application ID configured for federated access"
    required: true
  AZURE_TENANT_ID: 
    description: "The target Azure tenant"
    required: true
  AZURE_SUBSCRIPTION_ID: 
    description: "The target Azure subscription"
    required: true
  plan-file-name:
    description: "Filename to write the terraform plan output (-out) and later apply"
    required: false
    default: "plan.tfplan"
  plan-artifact-name:
    description: "Run-scoped identifier for the saved plan."
    default: "terraform-plan"
  perform-checkout:
    description: "Set to false if the repository has already been checked out with fetch-depth 0"
    required: false
    default: "true"
  enable-pr-comment:
    description: "Post Terraform plan results to the pull request using terraform-pr-commenter"
    required: false
    default: "true"
  pr-comment-workspace:
    description: "Optional workspace label override for PR comments; otherwise use the selected Terraform workspace"
    default: ""
runs:
  using: "composite"

  steps:
    - name: Checkout repository
      if: inputs.perform-checkout == 'true'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: 0

    - name: Setup Terraform
      id: toolchain
      uses: $/terraform-setup
      with:
        terraform-folder: ${{ inputs.terraform-folder }}
        terraform-version: ${{ inputs.terraform-version }}
        terraform_wrapper: "true"

    - name: Terraform Init
      shell: pwsh
      working-directory: ${{ inputs.terraform-folder }}
      run: |
        $params = @("init", "-input=false", "-lockfile=readonly")

        if ($env:TF_BACKEND_TERRAFORM_BACKEND_FILE -ne "") {
          $params += "-backend-config=" + $env:TF_BACKEND_TERRAFORM_BACKEND_FILE
        }

        if ($env:TF_BACKEND_BACKEND_SUBSCRIPTION_ID -ne "") {
          $params += "-backend-config=subscription_id=" + $env:TF_BACKEND_BACKEND_SUBSCRIPTION_ID
        }

        if ($env:TF_BACKEND_BACKEND_RESOURCE_GROUP_NAME -ne "") {
          $params += "-backend-config=resource_group_name=" + $env:TF_BACKEND_BACKEND_RESOURCE_GROUP_NAME
        }

        if ($env:TF_BACKEND_BACKEND_STORAGE_ACCOUNT_NAME -ne "") {
          $params += "-backend-config=storage_account_name=" + $env:TF_BACKEND_BACKEND_STORAGE_ACCOUNT_NAME
        }

        if ($env:TF_BACKEND_BACKEND_CONTAINER_NAME -ne "") {
          $params += "-backend-config=container_name=" + $env:TF_BACKEND_BACKEND_CONTAINER_NAME
        }

        if ($env:TF_BACKEND_BACKEND_KEY -ne "") {
          $params += "-backend-config=key=" + $env:TF_BACKEND_BACKEND_KEY
        }

        if ($env:TF_BACKEND_BACKEND_TAGS -ne "") {
          $params += "-backend-config=tags=" + $env:TF_BACKEND_BACKEND_TAGS
        }

        terraform $params
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      env:
        TF_BACKEND_TERRAFORM_BACKEND_FILE: ${{ inputs.terraform-backend-file }}
        TF_BACKEND_BACKEND_SUBSCRIPTION_ID: ${{ inputs.backend-subscription-id }}
        TF_BACKEND_BACKEND_RESOURCE_GROUP_NAME: ${{ inputs.backend-resource-group-name }}
        TF_BACKEND_BACKEND_STORAGE_ACCOUNT_NAME: ${{ inputs.backend-storage-account-name }}
        TF_BACKEND_BACKEND_CONTAINER_NAME: ${{ inputs.backend-container-name }}
        TF_BACKEND_BACKEND_KEY: ${{ inputs.backend-key }}
        TF_BACKEND_BACKEND_TAGS: ${{ inputs.backend-tags }}
        ARM_CLIENT_ID: ${{ inputs.AZURE_CLIENT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ inputs.AZURE_TENANT_ID }}
        ARM_USE_AZUREAD: true
        ARM_USE_OIDC: true

    - name: Terraform Validate
      shell: bash
      working-directory: ${{ inputs.terraform-folder }}
      run: |
        terraform validate

    - name: Terraform Plan
      id: plan
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.terraform-folder }}
      run: |
        set -euo pipefail
        args_file=$(mktemp)
        trap 'rm -f -- "$args_file"' EXIT
        python -c 'import os, shlex, sys; sys.stdout.buffer.write(b"".join(arg.encode() + b"\0" for arg in shlex.split(os.environ["TF_ADDITIONAL_ARGS"])))' > "$args_file"
        mapfile -d '' -t additional_args < "$args_file"
        rm -f -- "$args_file"
        trap - EXIT
        terraform plan -var-file="$ACTION_TF_VARS_PATH" -out="$TF_PLAN_FILE" "${additional_args[@]}"
        # Show the plan in human readable form
        terraform show "$TF_PLAN_FILE"
        # Write a no-color copy for the PR comment step. The comment reads this from a
        # file (not an environment variable) so large plans do not exceed the process
        # env/argument size limit when the PR-comment step spawns Node.
        terraform show -no-color "$TF_PLAN_FILE" > "$RUNNER_TEMP/tf-plan-output.txt"
      env:
        TF_ADDITIONAL_ARGS: ${{ inputs.terraform-additional-args }}
        TF_PLAN_FILE: ${{ inputs.plan-file-name }}
        ACTION_TF_VARS_PATH: ${{ inputs.terraform-var-file }}
        ARM_CLIENT_ID: ${{ inputs.AZURE_CLIENT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ inputs.AZURE_TENANT_ID }}
        ARM_USE_AZUREAD: true
        ARM_USE_OIDC: true

    - name: Post Terraform PR comment
      if: inputs.enable-pr-comment == 'true' && github.event_name == 'pull_request' && always() && (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure')
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        PLAN_OUTPUT_FILE: ${{ runner.temp }}/tf-plan-output.txt
        PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
        PLAN_OUTCOME: ${{ steps.plan.outcome }}
        TF_COMMENT_FOLDER: ${{ inputs.terraform-folder }}
        TF_COMMENT_WORKSPACE: ${{ inputs.pr-comment-workspace }}
        TF_COMMENT_ENVIRONMENT: ${{ inputs.terraform-environment }}
        TF_COMMENT_VAR_FILE: ${{ inputs.terraform-var-file }}
      with:
        script: |
          const fmt = require('${{ github.action_path }}/../terraform-pr-comment/format.js');
          await fmt.postComment(github, context, {
            kind: 'plan-and-apply',
            workflow: process.env.GITHUB_WORKFLOW,
            folder: process.env.TF_COMMENT_FOLDER,
            workspace: fmt.workspaceName(process.env.TF_COMMENT_WORKSPACE, process.env),
            environment: fmt.environmentName(process.env.TF_COMMENT_ENVIRONMENT, process.env.TF_COMMENT_VAR_FILE),
            plan: {
              stdout: fmt.readOutputFile(process.env.PLAN_OUTPUT_FILE),
              exitcode: process.env.PLAN_EXITCODE,
              outcome: process.env.PLAN_OUTCOME,
            },
          });

    - name: Bind saved plan to source and toolchain
      if: steps.plan.outcome == 'success'
      shell: bash
      env:
        TF_CONTEXT: ${{ steps.toolchain.outputs.directory }}
        TF_PLAN: ${{ inputs.plan-file-name }}
        TF_ENVIRONMENT: ${{ inputs.terraform-environment }}
        TF_VAR_FILE: ${{ inputs.terraform-var-file }}
      run: node "${{ github.action_path }}/../terraform-setup/context.cjs" save-plan

    - name: Store Terraform plan
      if: steps.plan.outcome == 'success'
      uses: $/terraform-plan-storage
      with:
        operation: upload
        context-directory: ${{ steps.toolchain.outputs.directory }}
        plan-file-name: ${{ inputs.plan-file-name }}
        plan-artifact-name: ${{ inputs.plan-artifact-name }}
        azure-client-id: ${{ inputs.AZURE_CLIENT_ID }}
        azure-tenant-id: ${{ inputs.AZURE_TENANT_ID }}
        azure-subscription-id: ${{ inputs.AZURE_SUBSCRIPTION_ID }}

    - name: Terraform Apply
      id: apply
      if: steps.plan.outputs.exitcode == '0'
      shell: bash
      working-directory: ${{ inputs.terraform-folder }}
      run: |
        set -euo pipefail
        args_file=$(mktemp)
        trap 'rm -f -- "$args_file"' EXIT
        python -c 'import os, shlex, sys; sys.stdout.buffer.write(b"".join(arg.encode() + b"\0" for arg in shlex.split(os.environ["TF_ADDITIONAL_ARGS"])))' > "$args_file"
        mapfile -d '' -t additional_args < "$args_file"
        rm -f -- "$args_file"
        trap - EXIT
        if [ ! -f "$TF_PLAN_FILE" ]; then
          echo "Expected plan file '$TF_PLAN_FILE' not found" >&2
          ls -al
          exit 1
        fi
        terraform apply -auto-approve "${additional_args[@]}" "$TF_PLAN_FILE"
      env:
        TF_ADDITIONAL_ARGS: ${{ inputs.terraform-additional-args }}
        TF_PLAN_FILE: ${{ inputs.plan-file-name }}
        ARM_CLIENT_ID: ${{ inputs.AZURE_CLIENT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ inputs.AZURE_TENANT_ID }}
        ARM_USE_AZUREAD: true
        ARM_USE_OIDC: true

    - name: Fail if plan failed
      if: steps.plan.outputs.exitcode != '0'
      shell: bash
      env:
        PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
      run: |
        echo "Terraform plan exit code: $PLAN_EXITCODE"
        exit 1

    - name: Publish Terraform apply execution evidence
      if: always() && steps.toolchain.outcome == 'success'
      uses: $/terraform-receipt
      with:
        context-directory: ${{ steps.toolchain.outputs.directory }}
        operation: apply
        outcome: ${{ steps.apply.outcome == 'success' && 'success' || 'failure' }}
        environment: ${{ inputs.terraform-environment }}
        terraform-var-file: ${{ inputs.terraform-var-file }}