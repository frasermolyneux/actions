name: CodeQL native integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  actual-public-source:
    if: github.event.repository.private == false && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        language: [actions, javascript-typescript, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          package-manager-cache: false
      - id: context
        uses: $/repository-analysis-context
        with:
          profile: '{"version":"repository-analysis-v1","languages":["actions","javascript","python"],"sonar":false}'
          github-token: ${{ github.token }}
      - name: Refuse licensed execution before initializing any private/unknown language
        shell: bash
        env:
          CONTEXT: ${{ steps.context.outputs.context }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const context = JSON.parse(process.env.CONTEXT);
          assert.equal(context.visibility, "public");
          assert(context.codeql.languages.includes(process.env.LANGUAGE));
          NODE
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Exercise byte-bound extraction contracts
        run: python -m unittest discover -s repository-analysis-codeql -p 'test_*.py'
      - id: init
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.1/codeql-bundle-linux64.tar.gz
      - id: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: /language:${{ matrix.language }}
          upload: never
          upload-database: false
      - name: Verify queried database archive bytes against actual maintained source
        shell: bash
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
          CODEQL_COMMAND: ${{ steps.init.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.init.outputs.codeql-version }}
          CODEQL_DATABASES: ${{ steps.analyze.outputs.db-locations }}
          CODEQL_SARIF_DIRECTORY: ${{ steps.analyze.outputs.sarif-output }}
          CODEQL_PYTHON: ${{ env.pythonLocation }}/bin/python
          ANALYSIS_PROFILE: '{"version":"repository-analysis-v1","languages":["actions","javascript","python"],"sonar":false}'
          GH_TOKEN: ${{ github.token }}
        run: node repository-analysis-codeql/integration.mjs
      - name: Publish only validated same-source output after live-public reauthorization
        id: publish
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: ${{ steps.analyze.outputs.sarif-output }}
          category: /language:${{ matrix.language }}
          wait-for-processing: true
      - name: Verify actual native publication independently
        id: native
        uses: $/repository-analysis-sarif
        with:
          profile: '{"version":"repository-analysis-v1","languages":["actions","javascript","python"],"sonar":false}'
          github-token: ${{ github.token }}
          tool-id: codeql/${{ matrix.language }}
          tool-version: ${{ steps.init.outputs.codeql-version }}
          source-sha: ${{ github.sha }}
          sarif-id: ${{ steps.publish.outputs.sarif-id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-source-${{ matrix.language }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/codeql-extraction-${{ matrix.language }}/proof.json
            ${{ steps.native.outputs.proof-directory }}/proof.json
          if-no-files-found: error
          retention-days: 14

  actual-compiled-fixtures:
    if: github.event.repository.private == false && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - family: sdk
            language: csharp
            os: ubuntu-latest
            bundle: linux64
            directory: dotnet-test/fixtures
            recipe: '{"version":1,"driver":"dotnet","projectKey":"fixture-not-published","sourceDirectory":"dotnet-test/fixtures","coverage":"cobertura"}'
            build: '{"kind":"dotnet","sdk":["9.0.x","10.0.x"],"globalJson":null,"solution":".","skipFormat":true,"tests":true}'
          - family: netfx
            language: csharp
            os: windows-latest
            bundle: win64
            directory: repository-analysis-sonar/fixtures/netfx
            recipe: '{"version":1,"driver":"dotnet","projectKey":"fixture-not-published","sourceDirectory":"repository-analysis-sonar/fixtures/netfx","coverage":"not-applicable"}'
            build: '{"kind":"netfx","sdk":["10.0.x"],"globalJson":null,"solution":"Fixture.sln","skipFormat":true,"tests":false}'
          - family: cpp
            language: cpp
            os: ubuntu-latest
            bundle: linux64
            directory: repository-analysis-sonar/fixtures/cpp
            recipe: '{"version":1,"driver":"cpp","projectKey":"fixture-not-published","sourceDirectory":"repository-analysis-sonar/fixtures/cpp","coverage":"not-applicable"}'
            build: '{"kind":"cmake","configureArgs":["-DCMAKE_BUILD_TYPE=Release","-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"],"buildArgs":["--config","Release"],"testArgs":["--output-on-failure","--build-config","Release"]}'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2
        if: matrix.language == 'csharp'
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57
        if: matrix.family == 'netfx'
      - uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123
        if: matrix.family == 'netfx'
      - id: context
        uses: $/repository-analysis-context
        with:
          profile: '{"version":"repository-analysis-v1","languages":["${{ matrix.language }}"],"sonar":true}'
          github-token: ${{ github.token }}
      - name: Refuse licensed execution before initializing any private/unknown language
        shell: bash
        env:
          CONTEXT: ${{ steps.context.outputs.context }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const context = JSON.parse(process.env.CONTEXT);
          assert.equal(context.visibility, "public");
          assert(context.codeql.languages.includes(process.env.LANGUAGE));
          NODE
      - id: init
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.1/codeql-bundle-${{ matrix.bundle }}.tar.gz
      - name: Execute original bounded compilation without provider or deployment credentials
        uses: $/repository-analysis-sonar
        with:
          mode: build
          profile: '{"version":"repository-analysis-v1","languages":["${{ matrix.language }}"],"sonar":true}'
          recipe: ${{ matrix.recipe }}
          build: ${{ matrix.build }}
          source-directory: ${{ github.workspace }}/${{ matrix.directory }}
          github-token: ${{ github.token }}
      - id: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          upload: never
          upload-database: false
          category: /fixture:${{ matrix.family }}
      - name: Require genuinely archived same-source compilation, not estimated baseline LOC
        shell: pwsh
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
          CODEQL_COMMAND: ${{ steps.init.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.init.outputs.codeql-version }}
          CODEQL_DATABASES: ${{ steps.analyze.outputs.db-locations }}
          CODEQL_SARIF_DIRECTORY: ${{ steps.analyze.outputs.sarif-output }}
          CODEQL_FIXTURE: "true"
          CODEQL_FIXTURE_DIRECTORY: ${{ matrix.directory }}
          ANALYSIS_PROFILE: '{"version":"repository-analysis-v1","languages":["${{ matrix.language }}"],"sonar":true}'
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:CODEQL_PYTHON = (Get-Command python -CommandType Application).Source
          node repository-analysis-codeql/integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-build-${{ matrix.family }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codeql-extraction-${{ matrix.language }}/proof.json
          if-no-files-found: error
          retention-days: 14
