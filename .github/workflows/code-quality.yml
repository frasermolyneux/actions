name: Code Quality

on:
  schedule:
    - cron: "0 8 * * 1"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/repository-analysis-sonar.yml
    with:
      profile: ${{ vars.REPOSITORY_ANALYSIS_PROFILE }}
      recipe: ${{ vars.REPOSITORY_ANALYSIS_SONAR_RECIPE }}
      build: ${{ vars.REPOSITORY_ANALYSIS_BUILD }}
      expected-sha: ${{ github.sha }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  devops-secure-scanning:
    permissions:
      contents: read
      actions: read
      id-token: write
      security-events: write
    uses: $/.github/workflows/devops-secure-scanning.yml

  dependency-review:
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          comment-summary-in-pr: always
