name: "assert-app-service-plan-empty"
description: "Fails when an Azure App Service plan still has apps or deployment slots attached"

inputs:
  app-service-plan-id:
    description: "The full Azure resource ID of the App Service plan"
    required: true
  AZURE_CLIENT_ID:
    description: "The Azure client/application ID configured for federated access"
    required: true
  AZURE_TENANT_ID:
    description: "The target Azure tenant"
    required: true
  AZURE_SUBSCRIPTION_ID:
    description: "The target Azure subscription"
    required: true

runs:
  using: "composite"
  steps:
    - name: Azure CLI login
      uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
      with:
        client-id: ${{ inputs.AZURE_CLIENT_ID }}
        tenant-id: ${{ inputs.AZURE_TENANT_ID }}
        subscription-id: ${{ inputs.AZURE_SUBSCRIPTION_ID }}

    - name: Assert App Service plan has no attachments
      shell: bash
      env:
        APP_SERVICE_PLAN_ID: ${{ inputs.app-service-plan-id }}
      run: bash "${{ github.action_path }}/assert-app-service-plan-empty.sh"
