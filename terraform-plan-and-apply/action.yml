name: "terraform-plan-and-apply"
description: "Runs terraform plan and apply in a single job with Azure OIDC authentication, optionally posting plan results to the PR"

inputs:
  terraform-version:
    description: "Optional exact assertion matching the committed root .terraform-version"
    default: ""
  terraform-environment:
    description: "Environment name override for execution evidence"
    default: ""
  terraform-folder:
    description: "The folder containing the Terraform projects"
    required: true
    default: "terraform"
  terraform-var-file:
    description: "The var-file to to be used for the Terraform plan (tfvars/dev.tfvars, tfvars/test.tfvars, tfvars/prod.tfvars, etc.)"
    required: true
    default: "tfvars/dev.tfvars"
  terraform-backend-file:
    description: "The backend-file to to be used for the Terraform plan (backends/dev.backend.hcl, backends/test.backend.hcl, backends/prod.backend.hcl, etc.)"
    required: false
  terraform-additional-args:
    description: "Additional arguments to be passed to the Terraform"
    required: false
    default: ""
  backend-subscription-id:
    description: "The backend subscription_id if the terraform-backend-file is not being used"
    required: false
  backend-resource-group-name:
    description: "The backend resource_group_name if the terraform-backend-file is not being used"
    required: false
  backend-storage-account-name:
    description: "The backend storage_account_name if the terraform-backend-file is not being used"
    required: false
  backend-container-name:
    description: "The backend container_name if the terraform-backend-file is not being used"
    required: false
    default: ""
  backend-key:
    description: "The backend key if the terraform-backend-file is not being used"
    required: false
    default: ""
  backend-tags:
    description: "The backend tags to be applied to the storage account"
    required: false
    default: ""
  AZURE_CLIENT_ID: 
    description: "The azure client/application ID configured for federated access"
    required: true
  AZURE_TENANT_ID: 
    description: "The target Azure tenant"
    required: true
  AZURE_SUBSCRIPTION_ID: 
    description: "The target Azure subscription"
    required: true
  plan-file-name:
    description: "Filename to write the terraform plan output (-out) and later apply"
    required: false
    default: "plan.tfplan"
  perform-checkout:
    description: "Set to false if the repository has already been checked out with fetch-depth 0"
    required: false
    default: "true"
  enable-pr-comment:
    description: "Post Terraform plan results to the pull request using terraform-pr-commenter"
    required: false
    default: "true"
  pr-comment-workspace:
    description: "Optional TF_WORKSPACE to disambiguate PR comments in matrix runs"
    required: false
    default: ""
  pr-comment-expand-summary-details:
    description: "Whether to expand summary details in the PR comment (EXPAND_SUMMARY_DETAILS)"
    required: false
    default: "true"
  pr-comment-highlight-changes:
    description: "Whether to highlight plan changes in the PR comment (HIGHLIGHT_CHANGES)"
    required: false
    default: "true"

runs:
  using: "composite"

  steps:
    - name: Checkout repository
      if: inputs.perform-checkout == 'true'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: 0

    - name: Setup Terraform
      id: toolchain
      uses: $/terraform-setup
      with:
        terraform-folder: ${{ inputs.terraform-folder }}
        terraform-version: ${{ inputs.terraform-version }}
        terraform_wrapper: "true"

    - name: Terraform Init
      shell: pwsh
      working-directory: ${{ inputs.terraform-folder }}
      run: |
        $params = @("init", "-input=false", "-lockfile=readonly")

        if ("${{ inputs.terraform-backend-file }}" -ne "") {
          $params += "-backend-config=${{ inputs.terraform-backend-file }}"
        }

        if ("${{ inputs.backend-subscription-id }}" -ne "") {
          $params += "-backend-config=subscription_id=${{ inputs.backend-subscription-id }}"
        }

        if ("${{ inputs.backend-resource-group-name }}" -ne "") {
          $params += "-backend-config=resource_group_name=${{ inputs.backend-resource-group-name }}"
        }

        if ("${{ inputs.backend-storage-account-name }}" -ne "") {
          $params += "-backend-config=storage_account_name=${{ inputs.backend-storage-account-name }}"
        }

        if ("${{ inputs.backend-container-name }}" -ne "") {
          $params += "-backend-config=container_name=${{ inputs.backend-container-name }}"
        }

        if ("${{ inputs.backend-key }}" -ne "") {
          $params += "-backend-config=key=${{ inputs.backend-key }}"
        }

        if ("${{ inputs.backend-tags }}" -ne "") {
          $params += "-backend-config=tags=${{ inputs.backend-tags }}"
        }

        terraform $params
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      env:
        ARM_CLIENT_ID: ${{ inputs.AZURE_CLIENT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ inputs.AZURE_TENANT_ID }}
        ARM_USE_AZUREAD: true
        ARM_USE_OIDC: true

    - name: Terraform Validate
      shell: bash
      working-directory: ${{ inputs.terraform-folder }}
      run: |
        terraform validate

    - name: Terraform Plan
      id: plan
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.terraform-folder }}
      run: |
        set -euo pipefail
        terraform plan -var-file=${{ inputs.terraform-var-file }} -out="${{ inputs.plan-file-name }}" ${{ inputs.terraform-additional-args }}
        # Show the plan in human readable form
        terraform show "${{ inputs.plan-file-name }}"
        # Write a no-color copy for the PR comment step. The comment reads this from a
        # file (not an environment variable) so large plans do not exceed the process
        # env/argument size limit when the PR-comment step spawns Node.
        terraform show -no-color "${{ inputs.plan-file-name }}" > "$RUNNER_TEMP/tf-plan-output.txt"
      env:
        ARM_CLIENT_ID: ${{ inputs.AZURE_CLIENT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ inputs.AZURE_TENANT_ID }}
        ARM_USE_AZUREAD: true
        ARM_USE_OIDC: true

    - name: Post Terraform PR comment
      if: inputs.enable-pr-comment == 'true' && github.event_name == 'pull_request' && always() && (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure')
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        PLAN_OUTPUT_FILE: ${{ runner.temp }}/tf-plan-output.txt
        PLAN_STDERR: ${{ steps.plan.outputs.stderr }}
        PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
        PLAN_OUTCOME: ${{ steps.plan.outcome }}
        TF_WORKSPACE: ${{ inputs.pr-comment-workspace }}
        TF_VAR_FILE: ${{ inputs.terraform-var-file }}
      with:
        script: |
          const fmt = require('${{ github.action_path }}/../terraform-pr-comment/format.js');
          const workspace = process.env.TF_WORKSPACE || '';
          const environment = fmt.deriveEnvironment(process.env.TF_VAR_FILE);
          const envSuffix = environment ? ` ${environment}` : '';
          const wsSuffix = workspace ? ` (${workspace})` : '';
          const marker = `<!-- terraform-pr-comment: plan-and-apply${envSuffix}${wsSuffix} -->`;

          const body = fmt.buildComment({
            marker,
            title: '🏗️ Terraform Plan & Apply',
            workspace,
            environment,
            plan: {
              stdout: fmt.readOutputFile(process.env.PLAN_OUTPUT_FILE),
              stderr: process.env.PLAN_STDERR,
              exitcode: process.env.PLAN_EXITCODE,
              outcome: process.env.PLAN_OUTCOME,
            },
          });

          await fmt.postComment(github, context, marker, body);

    - name: Terraform Apply
      id: apply
      if: steps.plan.outputs.exitcode == '0'
      shell: bash
      working-directory: ${{ inputs.terraform-folder }}
      run: |
        set -euo pipefail
        if [ ! -f "${{ inputs.plan-file-name }}" ]; then
          echo "Expected plan file '${{ inputs.plan-file-name }}' not found" >&2
          ls -al
          exit 1
        fi
        terraform apply -auto-approve ${{ inputs.terraform-additional-args }} "${{ inputs.plan-file-name }}"
      env:
        ARM_CLIENT_ID: ${{ inputs.AZURE_CLIENT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ inputs.AZURE_TENANT_ID }}
        ARM_USE_AZUREAD: true
        ARM_USE_OIDC: true

    - name: Fail if plan failed
      if: steps.plan.outputs.exitcode != '0'
      shell: bash
      run: |
        echo "Terraform plan exit code: ${{ steps.plan.outputs.exitcode }}"
        exit 1

    - name: Publish Terraform apply execution evidence
      if: always() && steps.toolchain.outcome == 'success'
      uses: $/terraform-receipt
      with:
        context-directory: ${{ steps.toolchain.outputs.directory }}
        operation: apply
        outcome: ${{ steps.apply.outcome == 'success' && 'success' || 'failure' }}
        environment: ${{ inputs.terraform-environment }}
        terraform-var-file: ${{ inputs.terraform-var-file }}