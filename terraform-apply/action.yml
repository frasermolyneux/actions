name: "terraform-apply"
description: "Retrieves and applies a saved Terraform plan with Azure OIDC authentication"

inputs:
  terraform-version:
    description: "Optional exact assertion matching the committed root .terraform-version"
    default: ""
  terraform-environment:
    description: "Required nonempty environment identity matching the saved-plan producer"
    required: true
  terraform-folder:
    description: "The folder containing the Terraform projects"
    required: true
    default: "terraform"
  terraform-backend-file:
    description: "The backend-file to to be used for the Terraform init (backends/dev.backend.hcl, etc.)"
    required: false
    default: ""
  backend-subscription-id:
    description: "The backend subscription_id if the terraform-backend-file is not being used"
    required: false
  backend-resource-group-name:
    description: "The backend resource_group_name if the terraform-backend-file is not being used"
    required: false
  backend-storage-account-name:
    description: "The backend storage_account_name if the terraform-backend-file is not being used"
    required: false
  backend-container-name:
    description: "The backend container_name if the terraform-backend-file is not being used"
    required: false
    default: "tfstate"
  backend-key:
    description: "The backend key if the terraform-backend-file is not being used"
    required: false
    default: "terraform.tfstate"
  backend-tags:
    description: "The backend tags to be applied to the storage account"
    required: false
    default: ""
  plan-file-name:
    description: "The filename of the previously generated binary plan."
    required: false
    default: "plan.tfplan"
  plan-artifact-name:
    description: "Run-scoped saved plan identifier shared with the producer."
    required: false
    default: "terraform-plan"
  terraform-additional-apply-args:
    description: "POSIX-style quoted argument list; no shell expansion; requires Python 3 on PATH"
    required: false
    default: ""
  AZURE_CLIENT_ID:
    description: "The azure client/application ID configured for federated access"
    required: true
  AZURE_TENANT_ID:
    description: "The target Azure tenant"
    required: true
  AZURE_SUBSCRIPTION_ID:
    description: "The target Azure subscription"
    required: true
  perform-checkout:
    description: "Set to false if the repository has already been checked out with fetch-depth 0"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      if: inputs.perform-checkout == 'true'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: 0

    - name: Setup Terraform
      id: toolchain
      uses: $/terraform-setup
      with:
        terraform-folder: ${{ inputs.terraform-folder }}
        terraform-version: ${{ inputs.terraform-version }}
        terraform_wrapper: "false"

    - name: Terraform Init
      shell: pwsh
      working-directory: ${{ inputs.terraform-folder }}
      run: |
        $params = @("init", "-input=false", "-lockfile=readonly")

        if ($env:TF_BACKEND_TERRAFORM_BACKEND_FILE -ne "") {
          $params += "-backend-config=" + $env:TF_BACKEND_TERRAFORM_BACKEND_FILE
        }

        if ($env:TF_BACKEND_BACKEND_SUBSCRIPTION_ID -ne "") {
          $params += "-backend-config=subscription_id=" + $env:TF_BACKEND_BACKEND_SUBSCRIPTION_ID
        }

        if ($env:TF_BACKEND_BACKEND_RESOURCE_GROUP_NAME -ne "") {
          $params += "-backend-config=resource_group_name=" + $env:TF_BACKEND_BACKEND_RESOURCE_GROUP_NAME
        }

        if ($env:TF_BACKEND_BACKEND_STORAGE_ACCOUNT_NAME -ne "") {
          $params += "-backend-config=storage_account_name=" + $env:TF_BACKEND_BACKEND_STORAGE_ACCOUNT_NAME
        }

        if ($env:TF_BACKEND_BACKEND_CONTAINER_NAME -ne "") {
          $params += "-backend-config=container_name=" + $env:TF_BACKEND_BACKEND_CONTAINER_NAME
        }

        if ($env:TF_BACKEND_BACKEND_KEY -ne "") {
          $params += "-backend-config=key=" + $env:TF_BACKEND_BACKEND_KEY
        }

        if ($env:TF_BACKEND_BACKEND_TAGS -ne "") {
          $params += "-backend-config=tags=" + $env:TF_BACKEND_BACKEND_TAGS
        }

        terraform $params
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      env:
        TF_BACKEND_TERRAFORM_BACKEND_FILE: ${{ inputs.terraform-backend-file }}
        TF_BACKEND_BACKEND_SUBSCRIPTION_ID: ${{ inputs.backend-subscription-id }}
        TF_BACKEND_BACKEND_RESOURCE_GROUP_NAME: ${{ inputs.backend-resource-group-name }}
        TF_BACKEND_BACKEND_STORAGE_ACCOUNT_NAME: ${{ inputs.backend-storage-account-name }}
        TF_BACKEND_BACKEND_CONTAINER_NAME: ${{ inputs.backend-container-name }}
        TF_BACKEND_BACKEND_KEY: ${{ inputs.backend-key }}
        TF_BACKEND_BACKEND_TAGS: ${{ inputs.backend-tags }}
        ARM_CLIENT_ID: ${{ inputs.AZURE_CLIENT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ inputs.AZURE_TENANT_ID }}
        ARM_USE_AZUREAD: true
        ARM_USE_OIDC: true

    - name: Retrieve Terraform plan
      uses: $/terraform-plan-storage
      with:
        operation: download
        context-directory: ${{ steps.toolchain.outputs.directory }}
        plan-file-name: ${{ inputs.plan-file-name }}
        plan-artifact-name: ${{ inputs.plan-artifact-name }}
        azure-client-id: ${{ inputs.AZURE_CLIENT_ID }}
        azure-tenant-id: ${{ inputs.AZURE_TENANT_ID }}
        azure-subscription-id: ${{ inputs.AZURE_SUBSCRIPTION_ID }}

    - name: Verify saved plan source and toolchain before mutation
      shell: bash
      env:
        TF_CONTEXT: ${{ steps.toolchain.outputs.directory }}
        TF_PLAN: ${{ inputs.plan-file-name }}
        TF_ENVIRONMENT: ${{ inputs.terraform-environment }}
      run: node "${{ github.action_path }}/../terraform-setup/context.cjs" verify-plan

    - name: Terraform Apply (from plan)
      id: apply
      shell: bash
      working-directory: ${{ inputs.terraform-folder }}
      run: |
        set -euo pipefail
        args_file=$(mktemp)
        trap 'rm -f -- "$args_file"' EXIT
        python -c 'import os, shlex, sys; sys.stdout.buffer.write(b"".join(arg.encode() + b"\0" for arg in shlex.split(os.environ["TF_ADDITIONAL_ARGS"])))' > "$args_file"
        mapfile -d '' -t additional_args < "$args_file"
        rm -f -- "$args_file"
        trap - EXIT
        if [ ! -f "$TF_PLAN_FILE" ]; then
          echo "Plan file '$TF_PLAN_FILE' not found in $PWD" >&2
          ls -al
          exit 1
        fi
        echo "Applying plan file $TF_PLAN_FILE"
        terraform apply -auto-approve "${additional_args[@]}" "$TF_PLAN_FILE"
      env:
        TF_ADDITIONAL_ARGS: ${{ inputs.terraform-additional-apply-args }}
        TF_PLAN_FILE: ${{ inputs.plan-file-name }}
        ARM_CLIENT_ID: ${{ inputs.AZURE_CLIENT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ inputs.AZURE_TENANT_ID }}
        ARM_USE_AZUREAD: true
        ARM_USE_OIDC: true

    - name: Publish Terraform apply execution evidence
      if: always() && steps.toolchain.outcome == 'success'
      uses: $/terraform-receipt
      with:
        context-directory: ${{ steps.toolchain.outputs.directory }}
        operation: apply
        outcome: ${{ steps.apply.outcome == 'success' && 'success' || 'failure' }}
        environment: ${{ inputs.terraform-environment }}
