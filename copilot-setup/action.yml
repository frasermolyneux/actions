name: "copilot-setup"
description: "Deterministic environment setup for Copilot coding-agent sessions (optional repository checkout and runtimes)."

inputs:
  checkout-repo:
    description: "Checkout the current repository when later setup steps need repository files."
    required: false
    default: "false"
  checkout-fetch-depth:
    description: "Fetch depth used when checking out the current repository."
    required: false
    default: "1"
  setup-dotnet:
    description: "Install .NET SDK(s)."
    required: false
    default: "false"
  dotnet-version:
    description: "The version(s) of .NET to install when setup-dotnet is true (newline or comma separated)."
    required: false
    default: ""
  setup-node:
    description: "Install Node.js."
    required: false
    default: "false"
  node-version:
    description: "The Node.js version to install when setup-node is true."
    required: false
    default: ""
  setup-python:
    description: "Install Python."
    required: false
    default: "false"
  python-version:
    description: "The Python version to install when setup-python is true."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Validate runtime versions
      if: inputs.setup-dotnet == 'true' || inputs.setup-node == 'true' || inputs.setup-python == 'true'
      shell: bash
      env:
        SETUP_DOTNET: ${{ inputs.setup-dotnet }}
        DOTNET_VERSION: ${{ inputs.dotnet-version }}
        SETUP_NODE: ${{ inputs.setup-node }}
        NODE_VERSION: ${{ inputs.node-version }}
        SETUP_PYTHON: ${{ inputs.setup-python }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        if [[ "$SETUP_DOTNET" == "true" && -z "$DOTNET_VERSION" ]]; then
          echo "dotnet-version is required when setup-dotnet is true." >&2
          exit 1
        fi
        if [[ "$SETUP_NODE" == "true" && -z "$NODE_VERSION" ]]; then
          echo "node-version is required when setup-node is true." >&2
          exit 1
        fi
        if [[ "$SETUP_PYTHON" == "true" && -z "$PYTHON_VERSION" ]]; then
          echo "python-version is required when setup-python is true." >&2
          exit 1
        fi

    - name: Checkout code
      if: inputs.checkout-repo == 'true'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: ${{ inputs.checkout-fetch-depth }}

    - name: Setup .NET
      if: inputs.setup-dotnet == 'true'
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Setup Node.js
      if: inputs.setup-node == 'true'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Python
      if: inputs.setup-python == 'true'
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: ${{ inputs.python-version }}
