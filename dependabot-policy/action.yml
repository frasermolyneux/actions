name: "dependabot-policy"
description: "Evaluates pull request author eligibility for auto-merge"

inputs:
  github-token:
    description: "GitHub token used by github-script"
    required: true
  major-update-label:
    description: "Deprecated compatibility input; major updates are no longer labeled by this action"
    required: false
    default: "run-prd-plan"

outputs:
  is_dependabot:
    description: "true when the pull request author is dependabot[bot]"
    value: ${{ steps.evaluate.outputs.is_dependabot }}
  is_eligible_author:
    description: "true when the pull request author is an approved bot"
    value: ${{ steps.evaluate.outputs.is_eligible_author }}
  auto_merge_allowed:
    description: "true when the pull request author is an approved bot"
    value: ${{ steps.evaluate.outputs.auto_merge_allowed }}
  policy_reason:
    description: "Human-readable reason describing the policy decision"
    value: ${{ steps.evaluate.outputs.policy_reason }}
  policy_code:
    description: "Machine-readable policy decision code"
    value: ${{ steps.evaluate.outputs.policy_code }}
  update_type:
    description: "Deprecated compatibility output; always unknown"
    value: ${{ steps.evaluate.outputs.update_type }}
  dependency_names:
    description: "Deprecated compatibility output; always unknown"
    value: ${{ steps.evaluate.outputs.dependency_names }}
  major_label_applied:
    description: "Deprecated compatibility output; always false"
    value: ${{ steps.evaluate.outputs.major_label_applied }}

runs:
  using: "composite"
  steps:
    - name: Evaluate auto-merge author policy
      id: evaluate
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        POLICY_ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const path = require('path');
          const { evaluateAuthor } = require(path.join(process.env.POLICY_ACTION_PATH, 'policy.cjs'));
          const decision = evaluateAuthor(context.payload.pull_request?.user);
          core.info(decision.policy_reason);
          for (const [name, value] of Object.entries(decision)) {
            core.setOutput(name, value);
          }
