name: "cmake-ci"
description: "Configures, builds, and optionally tests CMake projects"

inputs:
  perform-checkout:
    description: "Set to false if the repository has already been checked out"
    required: false
    default: "true"
  cmake-source-dir:
    description: "CMake source directory"
    required: false
    default: "."
  cmake-build-dir:
    description: "CMake build directory"
    required: false
    default: "build"
  cmake-configure-args:
    description: "POSIX-style quoted arguments for cmake configure; no shell expansion; requires Python 3 on PATH"
    required: false
    default: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
  cmake-build-args:
    description: "POSIX-style quoted arguments for cmake --build; no shell expansion; requires Python 3 on PATH"
    required: false
    default: "--config Release"
  ctest-args:
    description: "POSIX-style quoted arguments for ctest; no shell expansion; requires Python 3 on PATH"
    required: false
    default: "--output-on-failure --build-config Release"
  run-tests:
    description: "Set to false to skip ctest execution"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      if: inputs.perform-checkout == 'true'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: 0

    - name: Configure CMake
      shell: bash
      env:
        CMAKE_SOURCE_DIR: ${{ inputs.cmake-source-dir }}
        CMAKE_BUILD_DIR: ${{ inputs.cmake-build-dir }}
        CMAKE_ADDITIONAL_ARGS: ${{ inputs.cmake-configure-args }}
      run: |
        set -euo pipefail
        args_file=$(mktemp)
        trap 'rm -f -- "$args_file"' EXIT
        python -c 'import os, shlex, sys; sys.stdout.buffer.write(b"".join(arg.encode() + b"\0" for arg in shlex.split(os.environ["CMAKE_ADDITIONAL_ARGS"])))' > "$args_file"
        mapfile -d '' -t additional_args < "$args_file"
        rm -f -- "$args_file"
        trap - EXIT
        cmake -S "$CMAKE_SOURCE_DIR" -B "$CMAKE_BUILD_DIR" "${additional_args[@]}"

    - name: Build
      shell: bash
      env:
        CMAKE_BUILD_DIR: ${{ inputs.cmake-build-dir }}
        CMAKE_ADDITIONAL_ARGS: ${{ inputs.cmake-build-args }}
      run: |
        set -euo pipefail
        args_file=$(mktemp)
        trap 'rm -f -- "$args_file"' EXIT
        python -c 'import os, shlex, sys; sys.stdout.buffer.write(b"".join(arg.encode() + b"\0" for arg in shlex.split(os.environ["CMAKE_ADDITIONAL_ARGS"])))' > "$args_file"
        mapfile -d '' -t additional_args < "$args_file"
        rm -f -- "$args_file"
        trap - EXIT
        cmake --build "$CMAKE_BUILD_DIR" "${additional_args[@]}"

    - name: Test
      if: inputs.run-tests == 'true'
      shell: bash
      env:
        CMAKE_BUILD_DIR: ${{ inputs.cmake-build-dir }}
        CMAKE_ADDITIONAL_ARGS: ${{ inputs.ctest-args }}
      run: |
        set -euo pipefail
        args_file=$(mktemp)
        trap 'rm -f -- "$args_file"' EXIT
        python -c 'import os, shlex, sys; sys.stdout.buffer.write(b"".join(arg.encode() + b"\0" for arg in shlex.split(os.environ["CMAKE_ADDITIONAL_ARGS"])))' > "$args_file"
        mapfile -d '' -t additional_args < "$args_file"
        rm -f -- "$args_file"
        trap - EXIT
        ctest --test-dir "$CMAKE_BUILD_DIR" "${additional_args[@]}"