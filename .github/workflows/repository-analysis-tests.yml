name: Local analysis contracts
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  context-cache-independence:
    strategy:
      fail-fast: false
      matrix:
        declaration: [packageManager, devEngines]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: analysis-definition
          persist-credentials: false
      - name: Prepare npm metadata without any lockfile or dependency restore
        shell: python
        env:
          DECLARATION: ${{ matrix.declaration }}
        run: |
          import json
          import os
          from pathlib import Path

          declaration = os.environ["DECLARATION"]
          metadata = (
              {"packageManager": "npm@10.9.3"}
              if declaration == "packageManager"
              else {"devEngines": {"packageManager": {"name": "npm", "version": "10.9.3"}}}
          )
          Path("package.json").write_text(json.dumps(metadata), encoding="utf-8")
          assert not Path("package-lock.json").exists()
          assert not Path("npm-shrinkwrap.json").exists()
          assert not Path("node_modules").exists()
      - name: Confirm released preflight exposes the lockfile regression
        id: previous
        continue-on-error: true
        uses: frasermolyneux/actions/repository-analysis-context@repository-analysis-context/v1.0.1
        with:
          profile: '{"version":"repository-analysis-v1","languages":["actions"],"sonar":false}'
          github-token: ${{ github.token }}
      - name: Exercise actual metadata-only preflight
        id: context
        uses: ./analysis-definition/repository-analysis-context
        with:
          profile: '{"version":"repository-analysis-v1","languages":["actions"],"sonar":false}'
          github-token: ${{ github.token }}
      - name: Verify live identity without introducing package state
        shell: python
        env:
          ANALYSIS_CONTEXT: ${{ steps.context.outputs.context }}
          PREVIOUS_OUTCOME: ${{ steps.previous.outcome }}
        run: |
          import json
          import os
          from pathlib import Path

          context = json.loads(os.environ["ANALYSIS_CONTEXT"])
          assert os.environ["PREVIOUS_OUTCOME"] == "failure"
          assert context["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert context["repositoryId"] == int(os.environ["GITHUB_REPOSITORY_ID"])
          assert context["contract"] == "repository-analysis-v1"
          assert context["codeql"]["status"] == "eligible"
          assert context["sonar"]["status"] == "not-applicable"
          assert context["policyDigest"]
          assert not Path("package-lock.json").exists()
          assert not Path("npm-shrinkwrap.json").exists()
          assert not Path("node_modules").exists()

  local-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Check policy, source, credential and report boundaries
        shell: bash
        run: node --test repository-analysis-context/policy.test.mjs repository-analysis-local/scan.test.mjs

  live-composite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise actual composite and live repository identity
        id: scan
        uses: ./repository-analysis-local
        with:
          profile: '{"version":"repository-analysis-v1","languages":["actions"],"sonar":false}'
          tool: zizmor
          expected-sha: ${{ github.sha }}
          github-token: ${{ github.token }}
      - name: Retain originating-repository-only scanner evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-composite-evidence
          path: ${{ steps.scan.outputs.report-directory }}
          if-no-files-found: error
          retention-days: 7

  local-analyzer:
    strategy:
      fail-fast: false
      matrix:
        tool: [zizmor, semgrep-ce, checkov, bandit, shellcheck, psscriptanalyzer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Exercise actual pinned analyzer against synthetic private-policy fixtures
        shell: bash
        env:
          FIXTURE_TOOL: ${{ matrix.tool }}
        run: node repository-analysis-local/integration.mjs "$FIXTURE_TOOL"
