name: Repository CodeQL analysis

on:
  workflow_call:
    inputs:
      profile:
        description: Catalog repository-analysis-v1 capability profile.
        required: true
        type: string
      expected-sha:
        description: Actual originating workflow checkout SHA.
        required: true
        type: string
      build:
        description: Original analysis-only compiled build or JSON null for uncompiled profiles.
        default: "null"
        type: string
      source-directory:
        description: Original repository-relative compiler source directory.
        default: "."
        type: string
    outputs:
      artifact-id:
        description: Verified selected-CodeQL set, not a full-profile result.
        value: ${{ jobs.assemble.outputs.artifact-id }}

permissions: {}

jobs:
  plan:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      matrix: ${{ steps.plan.outputs.matrix }}
      has-languages: ${{ steps.plan.outputs.has-languages }}
    steps:
      - id: plan
        uses: $/repository-analysis-codeql
        with:
          mode: plan
          profile: ${{ inputs.profile }}
          expected-sha: ${{ inputs.expected-sha }}
          source-directory: ${{ inputs.source-directory }}
          build: ${{ inputs.build }}
          github-token: ${{ github.token }}

  native:
    needs: plan
    if: needs.plan.outputs.has-languages == 'true'
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Resolve trusted native archive-verification executable
        id: python
        shell: pwsh
        run: |
          $executable = Join-Path $env:pythonLocation $(if ($IsWindows) { 'python.exe' } else { 'bin/python' })
          "executable=$executable" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        if: matrix.language == 'csharp'
        with:
          dotnet-version: ${{ matrix.sdk }}
          global-json-file: ${{ fromJson(needs.plan.outputs.plan).build.globalJson || '' }}
      - if: matrix.family == 'netfx'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57
      - if: matrix.family == 'netfx'
        uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123
      - name: Refuse changed private visibility, source, author, definition or build before licensed initialization
        uses: $/repository-analysis-codeql
        with:
          mode: authorize
          profile: ${{ inputs.profile }}
          expected-sha: ${{ inputs.expected-sha }}
          source-directory: ${{ inputs.source-directory }}
          build: ${{ inputs.build }}
          plan: ${{ needs.plan.outputs.plan }}
          language: ${{ matrix.language }}
          github-token: ${{ github.token }}
      - id: init
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.buildMode }}
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.1/codeql-bundle-${{ matrix.bundle }}.tar.gz
      - name: Preserve actual SDK, Windows Framework or CMake compilation
        if: matrix.buildMode == 'manual'
        uses: $/repository-analysis-codeql
        with:
          mode: build
          profile: ${{ inputs.profile }}
          expected-sha: ${{ inputs.expected-sha }}
          source-directory: ${{ inputs.source-directory }}
          build: ${{ inputs.build }}
          plan: ${{ needs.plan.outputs.plan }}
          language: ${{ matrix.language }}
          github-token: ${{ github.token }}
      - id: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: /language:${{ matrix.language }}
          upload: never
          upload-database: false
      - name: Require actual byte-bound source extraction and reauthorization before publication
        uses: $/repository-analysis-codeql
        with:
          mode: extract
          profile: ${{ inputs.profile }}
          expected-sha: ${{ inputs.expected-sha }}
          source-directory: ${{ inputs.source-directory }}
          build: ${{ inputs.build }}
          plan: ${{ needs.plan.outputs.plan }}
          language: ${{ matrix.language }}
          command: ${{ steps.init.outputs.codeql-path }}
          version: ${{ steps.init.outputs.codeql-version }}
          databases: ${{ steps.analyze.outputs.db-locations }}
          sarif-directory: ${{ steps.analyze.outputs.sarif-output }}
          python: ${{ steps.python.outputs.executable }}
          github-token: ${{ github.token }}
      - id: upload
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: ${{ steps.analyze.outputs.sarif-output }}
          category: /language:${{ matrix.language }}
          ref: ${{ github.ref }}
          sha: ${{ inputs.expected-sha }}
          wait-for-processing: true
      - id: processing
        uses: $/repository-analysis-sarif
        with:
          profile: ${{ inputs.profile }}
          github-token: ${{ github.token }}
          tool-id: codeql/${{ matrix.language }}
          tool-version: ${{ steps.init.outputs.codeql-version }}
          source-sha: ${{ inputs.expected-sha }}
          sarif-id: ${{ steps.upload.outputs.sarif-id }}
      - id: report
        uses: $/repository-analysis-codeql
        with:
          mode: bind
          profile: ${{ inputs.profile }}
          expected-sha: ${{ inputs.expected-sha }}
          source-directory: ${{ inputs.source-directory }}
          build: ${{ inputs.build }}
          plan: ${{ needs.plan.outputs.plan }}
          language: ${{ matrix.language }}
          native-directory: ${{ steps.processing.outputs.proof-directory }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codeql-native-${{ matrix.language }}-${{ github.run_attempt }}
          path: |
            ${{ steps.report.outputs.report-directory }}/report.json
            ${{ steps.report.outputs.report-directory }}/native.json
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: [plan, native]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.native.result == 'success' || needs.native.result == 'skipped')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - shell: bash
        run: mkdir "$RUNNER_TEMP/selected-codeql-evidence"
      - if: needs.plan.outputs.has-languages == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: codeql-native-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/selected-codeql-evidence
      - id: result
        uses: $/repository-analysis-codeql
        with:
          mode: assemble
          profile: ${{ inputs.profile }}
          expected-sha: ${{ inputs.expected-sha }}
          source-directory: ${{ inputs.source-directory }}
          build: ${{ inputs.build }}
          plan: ${{ needs.plan.outputs.plan }}
          evidence-directory: ${{ runner.temp }}/selected-codeql-evidence
          github-token: ${{ github.token }}
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repository-analysis-codeql-set-${{ github.run_attempt }}
          path: ${{ steps.result.outputs.result-directory }}
          if-no-files-found: error
          retention-days: 14
