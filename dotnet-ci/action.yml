name: "dotnet-ci"
description: "Builds, tests, and optionally uploads NuGet packages for .NET solutions"

inputs:
  dotnet-version:
    description: "The version(s) of .NET to use (comma or newline separated)"
    required: true
    default: "9.0.x"
  src-folder:
    description: "The folder containing the .NET projects"
    required: true
    default: "src"
  perform-checkout:
    description: "Set to false if the repository has already been checked out with fetch-depth 0"
    required: false
    default: "true"
  skip-nuget-artifact-upload:
    description: "Set to true to skip uploading NuGet package artifacts"
    required: false
    default: "false"
  skip-format-check:
    description: "Set to true to skip dotnet format verification"
    required: false
    default: "false"
  format-target:
    description: "Path to pass to dotnet format (relative to src-folder)"
    required: false
    default: "."
  dotnet-workloads:
    description: "Optional space-separated list of .NET workloads to install (e.g. 'aspire')"
    required: false
    default: ""
  test-reporting:
    description: "Opt in to isolated multi-project TRX reporting; fails on missing, zero, or all-skipped tests."
    required: false
    default: "false"
  test-results-artifact-name:
    description: "Optional primary test-results artifact name; defaults to test-results-<src-folder>."
    required: false
    default: ""
  secondary-test-results-artifact-names:
    description: "Optional newline-separated additional artifact names (at most two) containing the same test results."
    required: false
    default: ""

outputs:
  test-report:
    description: "Schema-1 Unit report when test-reporting is enabled."
    value: ${{ steps.tests.outputs.report }}
  build_version:
    description: "NuGet package version resolved by Nerdbank.GitVersioning"
    value: ${{ steps.nbgv-metadata.outputs.build_version }}
  semver:
    description: "SemVer2 value"
    value: ${{ steps.nbgv-metadata.outputs.semver }}
  
runs:
  using: "composite"
  steps:
    - name: Prepare test artifact names
      id: test-artifacts
      shell: pwsh
      env:
        PRIMARY_NAME: ${{ inputs.test-results-artifact-name }}
        SECONDARY_NAMES: ${{ inputs.secondary-test-results-artifact-names }}
        SRC_FOLDER: ${{ inputs.src-folder }}
      run: |
        $primary = if ($env:PRIMARY_NAME) { $env:PRIMARY_NAME } else { "test-results-$env:SRC_FOLDER" }
        $secondary = @($env:SECONDARY_NAMES -split '\r?\n' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
        if ($primary -match '[\r\n]' -or $secondary.Count -gt 2) { throw 'Supply a single primary name and at most two secondary artifact names.' }
        $names = @($primary) + $secondary
        if (@($names | Select-Object -Unique).Count -ne $names.Count) { throw 'Test artifact names must be distinct.' }
        "primary=$primary" >> $env:GITHUB_OUTPUT
        if ($secondary.Count -gt 0) { "secondary1=$($secondary[0])" >> $env:GITHUB_OUTPUT }
        if ($secondary.Count -gt 1) { "secondary2=$($secondary[1])" >> $env:GITHUB_OUTPUT }
        if ($secondary.Count -gt 0) {
          $directory = Join-Path $env:RUNNER_TEMP "dotnet-ci-tests/$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $directory -ErrorAction Stop | Out-Null
          "legacy-directory=$directory" >> $env:GITHUB_OUTPUT
        }

    - name: Checkout repository
      if: inputs.perform-checkout == 'true'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: 0

    - name: Resolve Nerdbank.GitVersioning metadata
      id: nbgv-metadata
      uses: frasermolyneux/actions/nbgv-metadata@027d7e31bb32b734090aaed01b36d74f1d658b61 # nbgv-metadata/v1.2.1
      with:
        perform-checkout: 'false'

    - name: Setup .NET SDKs
      uses: frasermolyneux/actions/dotnet-sdk-setup@027d7e31bb32b734090aaed01b36d74f1d658b61 # dotnet-sdk-setup/v1.1.2
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Install .NET Workloads
      if: inputs.dotnet-workloads != ''
      shell: bash
      env:
        DOTNET_WORKLOADS: ${{ inputs.dotnet-workloads }}
      run: |
        set -f
        for workload in $DOTNET_WORKLOADS; do
          echo "Installing workload: $workload"
          dotnet workload install "$workload"
        done

    - name: Setup Package Cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ github.repository_id }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/*.sln', '**/*.slnx', '**/Directory.Packages.props', '**/nuget.config', '**/NuGet.config', '**/global.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-${{ github.repository_id }}-
          ${{ runner.os }}-nuget-
        
    - name: Restore Dependencies
      shell: bash
      env:
        SRC_FOLDER: ${{ inputs.src-folder }}
      run: |
        cd -- "$SRC_FOLDER"
        dotnet restore

    - name: Verify formatting
      if: inputs.skip-format-check != 'true'
      shell: bash
      env:
        SRC_FOLDER: ${{ inputs.src-folder }}
        FORMAT_TARGET: ${{ inputs.format-target }}
      run: |
        cd -- "$SRC_FOLDER"
        dotnet format "$FORMAT_TARGET" --no-restore --verify-no-changes
      
    - name: Build
      shell: bash
      env:
        SRC_FOLDER: ${{ inputs.src-folder }}
      run: |
        cd -- "$SRC_FOLDER"
        dotnet build --configuration Release --no-restore \
          /p:ContinuousIntegrationBuild=true \
          /p:IncludeSymbols=true \
          /p:SymbolPackageFormat=snupkg
      
    - name: Test
      if: inputs.test-reporting != 'true'
      shell: bash
      env:
        SRC_FOLDER: ${{ inputs.src-folder }}
        RESULTS_DIRECTORY: ${{ steps.test-artifacts.outputs.legacy-directory }}
      run: |
        cd -- "$SRC_FOLDER"
        dotnet test --configuration Release --no-build --verbosity normal --filter FullyQualifiedName!~IntegrationTests --logger "trx;LogFileName=test-results.trx" --results-directory "${RESULTS_DIRECTORY:-./TestResults}"

    - name: Upload Test Results
      if: always() && inputs.test-reporting != 'true' && steps.test-artifacts.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.test-artifacts.outputs.primary }}
        path: ${{ steps.test-artifacts.outputs.legacy-directory != '' && format('{0}/**/*.trx', steps.test-artifacts.outputs.legacy-directory) || format('{0}/TestResults/**/*.trx', inputs.src-folder) }}
        retention-days: 7

    - name: Test with GitHub reporting
      id: tests
      if: inputs.test-reporting == 'true'
      uses: frasermolyneux/actions/dotnet-test@c4dcaf4142a2e56a5c50af52c7c9eb8c441ebfab # dotnet-test/v1.1.1
      with:
        working-directory: ${{ inputs.src-folder }}
        artifact-name: ${{ steps.test-artifacts.outputs.primary }}

    - name: Upload secondary test results 1
      if: always() && steps.test-artifacts.outputs.secondary1 != '' && (inputs.test-reporting != 'true' || steps.tests.outputs.results-directory != '')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.test-artifacts.outputs.secondary1 }}
        path: ${{ inputs.test-reporting == 'true' && format('{0}/**', steps.tests.outputs.results-directory) || format('{0}/**/*.trx', steps.test-artifacts.outputs.legacy-directory) }}
        retention-days: 7
        if-no-files-found: ${{ inputs.test-reporting == 'true' && 'error' || 'warn' }}

    - name: Upload secondary test results 2
      if: always() && steps.test-artifacts.outputs.secondary2 != '' && (inputs.test-reporting != 'true' || steps.tests.outputs.results-directory != '')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.test-artifacts.outputs.secondary2 }}
        path: ${{ inputs.test-reporting == 'true' && format('{0}/**', steps.tests.outputs.results-directory) || format('{0}/**/*.trx', steps.test-artifacts.outputs.legacy-directory) }}
        retention-days: 7
        if-no-files-found: ${{ inputs.test-reporting == 'true' && 'error' || 'warn' }}

    - name: Upload NuGet Packages
      if: inputs.skip-nuget-artifact-upload != 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: nuget-packages
        path: |
          **/bin/Release/**/*.nupkg
          **/bin/Release/**/*.snupkg