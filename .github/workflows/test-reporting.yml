name: Test reporting contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared-quality-producer:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/codequality.yml
    with:
      sonar-project-key: fixture-unused-no-analysis
      build-target: dotnet-ci
      dotnet-version: |
        9.0.x
        10.0.x
      src-folder: .github
      test-reporting: true
      skip-format-check: true
      skip-sonar: true
      skip-codeql: true

  verify-shared-quality-evidence:
    needs: [shared-quality-producer]
    runs-on: ubuntu-latest
    steps:
      - name: Require the actual shared-workflow artifact identity
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ needs.shared-quality-producer.outputs.quality-evidence-artifact-id }}
        run: |
          if ($env:ARTIFACT_ID -notmatch '^[1-9][0-9]+$') {
            throw 'The reusable workflow must return its exact uploaded evidence artifact ID.'
          }
      - name: Download the exact shared-workflow artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.shared-quality-producer.outputs.quality-evidence-artifact-id }}
          path: ${{ runner.temp }}/shared-quality
          merge-multiple: true
      - name: Verify caller identity and all real fixture executions
        shell: pwsh
        env:
          EVIDENCE_FILE: ${{ runner.temp }}/shared-quality/estate-quality.json
        run: |
          $evidence = Get-Content -LiteralPath $env:EVIDENCE_FILE -Raw | ConvertFrom-Json
          if ($evidence.repository -ne $env:GITHUB_REPOSITORY -or
              $evidence.originSha -ne $env:GITHUB_SHA -or
              $evidence.workflowRef -ne $env:GITHUB_WORKFLOW_REF -or
              $evidence.workflowSha -ne $env:GITHUB_WORKFLOW_SHA -or
              $evidence.runId -ne $env:GITHUB_RUN_ID -or
              $evidence.attempt -ne [int]$env:GITHUB_RUN_ATTEMPT -or
              $evidence.job -ne 'test-results' -or
              $evidence.reports.Count -ne 1 -or
              $evidence.reports[0].job -ne 'code-quality' -or
              $evidence.reports[0].suite -ne 'Unit' -or
              $evidence.reports[0].status -ne 'passed' -or
              $evidence.reports[0].total -ne 4 -or $evidence.reports[0].passed -ne 4 -or
              -not $evidence.reports[0].artifactId) {
            throw 'Shared analysis must preserve caller workflow identity and all four measured fixture executions.'
          }

  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Test TRX parsing and PR publishing contracts
        run: node --test dotnet-test/action.test.js dotnet-test/coverage.test.js dotnet-test/run-tests.test.js dotnet-test-report/report.test.js test-results-summary/summary.test.js
      - name: Test analysis capability selection
        shell: pwsh
        run: node --test repository-analysis-context/policy.test.mjs
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Resolve sibling actions locally for pre-release smoke test
        shell: pwsh
        run: |
          $path = 'dotnet-test/action.yml'
          $content = [IO.File]::ReadAllText($path)
          $content = $content.Replace('frasermolyneux/actions/dotnet-test-report@dotnet-test-report/v1.1', './dotnet-test-report')
          [IO.File]::WriteAllText($path, $content)
      - name: Exercise two projects and two frameworks
        id: smoke
        uses: ./dotnet-test
        with:
          working-directory: dotnet-test/fixtures
          no-build: "false"
          artifact-name: test-reporting-smoke-${{ matrix.os }}

      - name: Retain the real test execution as structured evidence
        id: evidence-smoke
        uses: ./test-results-summary
        with:
          publish-comment: "false"
          jobs: >-
            {"smoke":{"result":"${{ steps.smoke.outcome }}","outputs":{"test_report":${{ toJSON(steps.smoke.outputs.report) }}}}}

      - name: Verify structured evidence was uploaded
        shell: pwsh
        env:
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence-smoke.outputs.evidence-artifact-id }}
        run: |
          if ($env:EVIDENCE_ARTIFACT_ID -notmatch '^[1-9][0-9]+$') {
            throw 'Structured test evidence must have a real uploaded artifact ID.'
          }

      - name: Download the actual structured evidence artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.evidence-smoke.outputs.evidence-artifact-id }}
          path: ${{ runner.temp }}/estate-quality-smoke
          merge-multiple: true

      - name: Verify retained identity and measured counters
        shell: pwsh
        env:
          EVIDENCE_FILE: ${{ runner.temp }}/estate-quality-smoke/estate-quality.json
          SOURCE_ARTIFACT_ID: ${{ steps.smoke.outputs.artifact-id }}
        run: |
          $evidence = Get-Content -LiteralPath $env:EVIDENCE_FILE -Raw | ConvertFrom-Json
          if ($evidence.schema -ne 1 -or $evidence.kind -ne 'test-summary' -or
              $evidence.repository -ne $env:GITHUB_REPOSITORY -or
              $evidence.originSha -ne $env:GITHUB_SHA -or
              $evidence.runId -ne $env:GITHUB_RUN_ID -or
              $evidence.attempt -ne [int]$env:GITHUB_RUN_ATTEMPT -or
              $evidence.workflowRef -ne $env:GITHUB_WORKFLOW_REF -or
              $evidence.workflowSha -ne $env:GITHUB_WORKFLOW_SHA -or
              $evidence.reports.Count -ne 1 -or
              $evidence.reports[0].status -ne 'passed' -or
              $evidence.reports[0].total -ne 4 -or $evidence.reports[0].passed -ne 4 -or
              $evidence.reports[0].artifactId -ne $env:SOURCE_ARTIFACT_ID) {
            throw 'Downloaded evidence must retain exact workflow/attempt identity and actual test counters.'
          }

      - name: Check out reviewed fixture source independently of the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 254f9d0e0ac54c1087bceafed52f80965e2a1937
          path: coverage-source
          persist-credentials: false

      - name: Collect native coverage from the independently checked out fixtures
        id: coverage-smoke
        uses: ./dotnet-test
        with:
          working-directory: coverage-source/dotnet-test/fixtures
          no-build: "false"
          artifact-name: test-coverage-smoke-${{ matrix.os }}
          coverage: "true"
      - name: Verify all four executions were retained
        shell: pwsh
        env:
          TEST_REPORT: ${{ steps.smoke.outputs.report }}
          COVERAGE_TEST_REPORT: ${{ steps.coverage-smoke.outputs.report }}
          COVERAGE_REPORT: ${{ steps.coverage-smoke.outputs.coverage-report }}
        run: |
          $report = $env:TEST_REPORT | ConvertFrom-Json
          if ($report.status -ne 'passed' -or $report.total -ne 4 -or $report.passed -ne 4 -or -not $report.artifactId) {
            throw 'The multi-project/multi-framework smoke report must contain all four passing executions and its artifact ID.'
          }
          $coveredTests = $env:COVERAGE_TEST_REPORT | ConvertFrom-Json
          if ($coveredTests.status -ne 'passed' -or $coveredTests.total -ne 4 -or $coveredTests.passed -ne 4 -or
              -not $coveredTests.artifactId) { throw 'Coverage collection must preserve all four passing test executions.' }
          $coverage = $env:COVERAGE_REPORT | ConvertFrom-Json
          $sourceSha = git -C coverage-source rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $sourceSha -eq $env:GITHUB_SHA) {
            throw 'The independent checkout must exercise different actual source and caller revisions.'
          }
          if ($coverage.status -ne 'collected' -or $coverage.toolVersion -notmatch '^18\.11\.2(\+[A-Za-z0-9.-]+)?$' -or
              $coverage.lines.total -le 0 -or $coverage.lines.covered -le 0 -or
              $coverage.sha256 -notmatch '^[a-f0-9]{64}$' -or $coverage.sourceSha -ne $sourceSha) {
            throw 'Real native coverage must retain nonempty instrumentation and the hashed report.'
          }
