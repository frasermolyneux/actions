name: terraform-plan-storage
description: Store or retrieve a source-bound Terraform plan in the initialized Azure backend account
inputs:
  operation:
    description: upload or download
    required: true
  context-directory:
    description: Private directory returned by terraform-setup
    required: true
  plan-file-name:
    description: Simple plan filename
    required: true
  plan-artifact-name:
    description: Run-scoped plan identifier shared by producer and consumer
    required: true
  azure-client-id:
    description: Federated Azure application ID
    required: true
  azure-tenant-id:
    description: Azure tenant ID
    required: true
  azure-subscription-id:
    description: Azure subscription ID
    required: true
runs:
  using: composite
  steps:
    - name: Authenticate to Azure with OIDC
      uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}
    - name: Transfer saved plan
      shell: pwsh
      env:
        TF_STORAGE_OPERATION: ${{ inputs.operation }}
        TF_CONTEXT: ${{ inputs.context-directory }}
        TF_PLAN: ${{ inputs.plan-file-name }}
        TF_PLAN_ID: ${{ inputs.plan-artifact-name }}
        TF_STORAGE_SCRIPT: ${{ github.action_path }}/storage.cjs
      run: |
        $ErrorActionPreference = 'Stop'
        $transfer = node $env:TF_STORAGE_SCRIPT prepare
        if ($LASTEXITCODE -ne 0) { throw 'Unable to prepare saved plan transfer' }
        $details = $transfer | ConvertFrom-Json
        try {
          if ($env:TF_STORAGE_OPERATION -eq 'upload') {
            & az storage blob upload --account-name $details.account --container-name tfplan --name $details.blob --file $details.bundle --auth-mode login --overwrite false --if-none-match '*' --only-show-errors --output none
          } elseif ($env:TF_STORAGE_OPERATION -eq 'download') {
            & az storage blob download --account-name $details.account --container-name tfplan --name $details.blob --file $details.bundle --auth-mode login --only-show-errors --output none
          } else {
            throw 'Invalid saved plan transfer operation'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Saved plan blob transfer failed' }
          if ($env:TF_STORAGE_OPERATION -eq 'download') {
            node $env:TF_STORAGE_SCRIPT unpack
            if ($LASTEXITCODE -ne 0) { throw 'Unable to unpack saved plan' }
          }
        } finally {
          if (Test-Path -LiteralPath $details.bundle -PathType Leaf) {
            Remove-Item -LiteralPath $details.bundle -Force
          }
        }
